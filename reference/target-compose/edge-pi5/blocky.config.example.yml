# Minimal blocky config — replace with live export from current mini instance.
# Place at: /opt/homelab/blocky/config.yml (or path used in compose).

upstreams:
  groups:
    default:
      - 1.1.1.1
      - 1.0.0.1

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads

ports:
  dns: 53
  http: 4000

log:
  level: info
