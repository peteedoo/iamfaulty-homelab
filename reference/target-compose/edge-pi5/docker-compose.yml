# Edge cluster — Raspberry Pi 5 (aarch64)
# Deploy under e.g. /opt/homelab/docker-compose.yml
#
# Order:
#   docker compose --profile apps up -d     # non-DNS first
#   docker compose --profile dns up -d      # blocky LAST

services:
  homeassistant:
    profiles: ["apps"]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    environment:
      TZ: America/Chicago
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: host

  uptime-kuma:
    profiles: ["apps"]
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./uptime-kuma:/app/data
    ports:
      - "3001:3001"

  speedtest-tracker:
    profiles: ["apps"]
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      APP_KEY: ${SPEEDTEST_APP_KEY}
      DB_CONNECTION: sqlite
    volumes:
      - ./speedtest-tracker:/config
    ports:
      - "8765:80"

  netalertx:
    profiles: ["apps"]
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: America/Chicago
      PORT: "20211"
      GRAPHQL_PORT: "20212"
    volumes:
      - ./netalertx:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:uid=20211,gid=20211,mode=1700
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

  # DNS — bring up ONLY after apps are healthy and you are ready to cut over resolvers
  blocky:
    profiles: ["dns"]
    image: ghcr.io/0xerr0r/blocky:latest
    container_name: blocky
    restart: unless-stopped
    environment:
      TZ: America/Chicago
      BLOCKY_CONFIG_FILE: /app/config.yml
    volumes:
      - ./blocky/config.yml:/app/config.yml:ro
      - ./blocky/logs:/logs
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "4000:4000/tcp"
