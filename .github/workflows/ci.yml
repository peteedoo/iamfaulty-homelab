name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Run lint and typecheck in parallel for fast feedback
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: forge-build-output
          path: forge/server/dist/

  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
